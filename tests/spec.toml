# Groups of the conformance cases (TESTING.md "Groups"). Rules are tried in order; the
# first that matches a case decides its group:
#
#   skip    psh will never do this, or bash's own result is not reproducible. Left out
#           of the denominator and not run.
#   later   on the roadmap but outside the current milestone; run and reported apart.
#   active  everything else: the ratchet applies.
#
# Every rule has a reason. `match` takes globs on case ids (`*` within one part, `**`
# across parts: oils/alias/*, brush/compat/builtins/**); `tag` matches case tags (pty,
# interactive). Moving cases between groups is a coordinator decision.

# --- Never: interactive shell features (D002) ---------------------------------------

[[skip]]
tag = ["pty", "interactive"]
reason = "needs a terminal or an interactive shell (D002)"

[[skip]]
match = [
  "oils/interactive/*",
  "oils/prompt/*",
  "brush/compat/interactive/*",
  "brush/compat/prompt/*",
]
reason = "interactive shell and prompt rendering (D002)"

[[skip]]
match = [
  "oils/history-expand/*",
  "oils/builtin-history/*",
  "oils/builtin-fc/*",
  "brush/compat/builtins/history/*",
  "brush/compat/builtins/fc/*",
]
reason = "history (D002)"

[[skip]]
match = [
  "oils/builtin-completion/*",
  "oils/builtin-bind/*",
  "brush/compat/completion/*",
  "brush/compat/builtins/compgen/*",
  "brush/compat/builtins/complete/*",
  "brush/compat/builtins/bind/*",
]
reason = "completion and line editing (D002)"

[[skip]]
match = [
  "brush/compat/compound_cmds/select/*",
  "brush/compat/builtins/suspend/*",
]
reason = "select and job suspension are interactive features (D002)"

[[skip]]
match = ["oils/zsh-assoc/*", "oils/zsh-idioms/*"]
reason = "zsh-only idioms; psh has no zsh mode (D002)"

[[skip]]
match = [
  "brush/brush/brushctl/*",
  "brush/brush/cli/*",
  "brush/brush/completion/*",
  "brush/brush/help/*",
  "brush/brush/zsh_hooks/*",
  "brush/compat/builtins/help/*",
]
reason = "brush's own command line, help text and extensions, not bash behavior to match"

# --- Never: bash's own result is not reproducible -----------------------------------
# Found by `scripts/record-goldens --check` (four recordings): process ids, clock
# times, $RANDOM, or races between processes decide stdout or status.

[[skip]]
match = [
  "oils/background/12",
  "oils/background/22",
  "oils/background/26",
  "oils/bugs/11",
  "oils/builtin-process/9",
  "oils/builtin-process/16",
  "oils/posix/12",
  "oils/redirect/23",
  "oils/redirect/24",
  "oils/sh-usage/11",
  "oils/vars-special/6",
  "oils/vars-special/17",
  "brush/compat/builtins/read/17",
  "brush/compat/builtins/read/18",
  "brush/compat/builtins/times/0",
  "brush/compat/builtins/trap/61",
  "brush/compat/builtins/trap/62",
  "brush/compat/builtins/wait/4",
  "brush/compat/compound_cmds/coproc/15",
  "brush/compat/options/set-e/144",
]
reason = "nondeterministic in bash itself (pids, clock, $RANDOM, timing)"

# --- Later ---------------------------------------------------------------------------

[[later]]
match = ["brush/compat/compound_cmds/coproc/*"]
reason = "coproc: bash feature outside the first milestone"

# --- Serial: cases that must not run at the same time --------------------------------
# Not a group: these cases also count in their group above. They use fixed paths outside
# their own directory (`/tmp/oil-spec-test/pwd`, `/tmp/spam`, `/tmp/oils-spec`, ...), so
# two of them running at once, in this run or another psh-spec run on the machine,
# race (one removes the directory another is in). Each holds a machine-wide lock while
# it runs.

[[serial]]
match = [
  "oils/builtin-cd/9",
  "oils/builtin-cd/10",
  "oils/builtin-cd/11",
  "oils/builtin-cd/12",
  "oils/builtin-cd/13",
  "oils/builtin-cd/22",
  "oils/builtin-cd/23",
  "oils/builtin-cd/25",
  "oils/builtin-cd/27",
  "oils/builtin-dirs/0",
  "oils/builtin-dirs/1",
  "oils/builtin-dirs/4",
  "oils/builtin-dirs/6",
  "oils/builtin-dirs/7",
  "oils/builtin-dirs/8",
  "oils/builtin-dirs/9",
  "oils/builtin-dirs/10",
  "oils/builtin-dirs/11",
  "oils/builtin-dirs/12",
  "oils/builtin-dirs/13",
  "oils/builtin-dirs/14",
  "oils/builtin-dirs/15",
  "oils/builtin-type-bash/8",
  "oils/builtin-type-bash/16",
  # /tmp/test_source_$$.sh with the runner's fixed fake $$ (0028)
  "brush/compat/options/set-e/119",
  "brush/compat/options/set-e/120",
  "brush/compat/options/set-e/121",
  "brush/compat/options/set-e/122",
]
reason = "fixed paths under /tmp shared between cases (every case of these files that uses /tmp)"

# --- Flaky: quarantined races ----------------------------------------------------------
# Not a group: these cases also count in their group above. They run and are reported
# (psh-spec and scripts/status list them, with whether they passed), but pass or fail
# never fails the gate, and they are in no expected-failures file (D1225). No retries:
# a quarantine is a known race with an owner, to be fixed, not hidden.

[[flaky]]
match = "oils/background/7"
reason = "timing race: jobs started 10 ms apart finish in either order on a loaded machine (0006 log; owner: procs, 0030)"

[[flaky]]
match = "brush/compat/signals/13"
reason = "race: when the loop writes before head starts, psh's pumped pipe buffers 64 KiB more than bash's kernel pipe, so the writer can finish instead of getting SIGPIPE (0006 log; owner: procs, 0030)"

[[flaky]]
match = "oils/builtin-trap/31"
reason = "100 ms trap-install window races under gate load (Windows VM leg running concurrently); owner: procs, 0030"

[[flaky]]
match = "brush/compat/background_jobs/18"
reason = "timing under load: background job inside command substitution (flaked in several gates; owner: procs, 0030)"

# --- Platform: host-specific cases -----------------------------------------------------
# Not a group either: these cases depend on the host itself, not on psh (a device only
# Linux has, the /bin layout, /proc, a case-insensitive file system, a signal a system
# lacks). The goldens come from Linux, so they are gated there; on other platforms they
# run and are reported apart, in no ratchet (D1331). A case that differs only because a
# platform's *programs* differ (BSD utilities) is no such case: it goes in that
# platform's expected-failures.<os>.txt.

[[platform]]
match = [
  "oils/bugs/13",
  "brush/compat/builtins/return/1",
  "brush/compat/options/bash_xtracefd/6",
]
reason = "writes to /dev/full, which only Linux has"

[[platform]]
match = [
  "oils/builtin-cd/11",
  "oils/builtin-cd/12",
]
reason = "/tmp is a symlink to /private/tmp on macOS"

[[platform]]
match = [
  "oils/tilde/7",
  "oils/tilde/13",
  "oils/toysh/5",
  "brush/compat/word_expansion/tilde/1",
]
reason = "root's home is /var/root on macOS, /root on Linux"

[[platform]]
match = [
  "brush/compat/builtins/kill/1",
  "brush/compat/builtins/kill/3",
  "brush/compat/builtins/kill/12",
  "brush/compat/signals/10",
]
reason = "signal numbers differ: SIGUSR1 is 30 on macOS, 10 on Linux"

[[platform]]
match = [
  "oils/builtin-type-bash/13",
  "oils/builtin-type-bash/14",
  "oils/builtin-type-bash/21",
  "oils/builtin-type-bash/22",
  "brush/compat/builtins/type/11",
]
reason = "macOS ships /usr/bin/cd, /usr/bin/type and /usr/bin/command scripts"

[[platform]]
match = [
  "oils/builtin-type-bash/30",
  "oils/divergence/3",
  "oils/errexit/9",
  "brush/compat/builtins/command/7",
  "brush/compat/builtins/hash/3",
  "brush/compat/builtins/type/1",
  "brush/compat/builtins/type/7",
  "brush/compat/builtins/type/9",
  "brush/compat/builtins/type/12",
  "brush/compat/builtins/type/15",
  "brush/compat/builtins/type/18",
  "brush/compat/builtins/type/21",
  "brush/compat/builtins/type/26",
]
reason = "the /bin layout: Linux (merged /usr) has ls, cat and true in /usr/bin, macOS only in /bin"

[[platform]]
match = [
  "oils/builtin-printf/46",
  "oils/builtin-printf/48",
]
reason = "the time zone database: macOS has legacy zones (Portugal, US/Eastern) the recording image lacks"

[[platform]]
match = [
  "oils/unicode/0",
]
reason = "APFS rejects file names that are not UTF-8"

[[platform]]
match = "brush/compat/builtins/jobs/12"
reason = "needs /proc"
